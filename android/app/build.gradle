apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


react {
    autolinkLibrariesWithApp()
    enableBundleCompression = true
}

tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    sources.exclude("__tests__/**", "scripts/**", "test-*.ts", "test-*.js")
    inputs.dir(file("../../assets"))
    inputs.files(file("../../package.json"), file("../../package-lock.json"),
        file("../../metro.config.cjs"), file("../../babel.config.cjs"))
}

if (providers.gradleProperty("freetuneBuildDirectory").isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty("freetuneBuildDirectory").get()))
    afterEvaluate {
        tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
            def output = new File(rootProject.projectDir.absolutePath, ".release-output")
            jsBundleDir.set(new File(output, "generated/assets/react/release"))
            resourcesDir.set(new File(output, "generated/res/react/release-webp"))
            jsIntermediateSourceMapsDir.set(new File(output, "intermediates/sourcemaps/react/release"))
            jsSourceMapsDir.set(new File(output, "generated/sourcemaps/react/release"))
        }
    }
}

def fingerprintOutput = layout.buildDirectory.dir("generated/fingerprint/jniLibs")

def enableProguardInReleaseBuilds = true

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.freetune"
    sourceSets.main.jniLibs.setSrcDirs([fingerprintOutput])
    defaultConfig {
        applicationId "com.freetune"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "1.0"
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_STORE_FILE")
            storeFile keystorePath ? file(keystorePath) : null
            storePassword System.getenv("RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    splits {
        abi {
            enable project.hasProperty("splitApks")
            reset()
            include(*(providers.gradleProperty("reactNativeArchitectures")
                .orElse("armeabi-v7a,arm64-v8a").get().split(",")
                .findAll { it in ["armeabi-v7a", "arm64-v8a"] }))
            universalApk false
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-splash-screen')
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
project.ext.vectoricons = [iconFontNames: ["MaterialCommunityIcons.ttf", "Ionicons.ttf"]]
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

tasks.register("buildSongFingerprintNative", Exec) {
    def architectures = providers.gradleProperty("reactNativeArchitectures")
        .orElse("armeabi-v7a,arm64-v8a,x86_64").get().split(",").toList()
    workingDir file("../song-fingerprint")
    inputs.dir(file("../song-fingerprint/src"))
    inputs.dir(file("../song-fingerprint/models"))
    inputs.files(file("../song-fingerprint/Cargo.toml"), file("../song-fingerprint/Cargo.lock"))
    inputs.property("architectures", architectures)
    inputs.property("ndkVersion", android.ndkVersion)
    inputs.property("rustToolchain", providers.environmentVariable("RUSTUP_TOOLCHAIN").orElse("default"))
    outputs.files(architectures.collect { new File(fingerprintOutput.get().asFile, "${it}/libfreetune_song_fingerprint.so") })
    commandLine(["cargo", "ndk"] + architectures.collectMany { ["-t", it] } +
        ["-o", fingerprintOutput.get().asFile.absolutePath, "build", "--release", "--locked", "--lib"])
}
tasks.named("preBuild").configure { dependsOn("buildSongFingerprintNative") }

if (rootProject.file("../.git").exists()) {
    def sourceRevision = providers.exec {
        workingDir rootProject.projectDir
        commandLine "git", "rev-parse", "HEAD"
    }.standardOutput.asText.map { it.trim() }
    tasks.matching { it.name == "extractReleaseVersionControlInfo" }.configureEach {
        inputs.property("sourceRevision", sourceRevision)
    }
}
