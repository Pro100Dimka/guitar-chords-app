buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    // Optional bounded native compilation for CI and low-memory build machines.
    // Gradle's --max-workers does not by itself limit Ninja's C++ compile pool.
    if (rootProject.hasProperty("nativeWorkers")) {
        def nativeWorkers = rootProject.property("nativeWorkers").toString()
        ["com.android.application", "com.android.library"].each { androidPlugin ->
            plugins.withId(androidPlugin) {
                extensions.getByName("android").defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                    "-DCMAKE_JOB_POOLS=freetune_compile=${nativeWorkers};freetune_link=1".toString(),
                    "-DCMAKE_JOB_POOL_COMPILE=freetune_compile",
                    "-DCMAKE_JOB_POOL_LINK=freetune_link"
                ])
            }
        }
    }
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
