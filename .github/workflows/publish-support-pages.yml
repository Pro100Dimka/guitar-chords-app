name: Publish support pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: support-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public pages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/support-pages"
          cp docs/privacy.html docs/support.html "$RUNNER_TEMP/support-pages/"
          cp docs/support.html "$RUNNER_TEMP/support-pages/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/support-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
