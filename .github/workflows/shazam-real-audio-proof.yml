name: shazam-real-audio-proof
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shazam-real-audio-proof.yml
      - android/song-fingerprint/**
      - android/app/src/main/java/com/freetune/SongRecognitionModule.kt
      - android/app/src/main/java/com/freetune/SongFingerprint.kt
      - scripts/verify-shazam.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shazam-real-audio-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore native fingerprint dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/song-fingerprint
          key: shazam-host
          cache-bin: false
      - name: Ensure audio decoder is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Decode known recognition fixture
        run: |
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/shazamio/ShazamIO/c2a4b6ee9dfa9e36cd6b24d10a57ad9e66a66dd1/examples/data/Gloria.ogg' -o /tmp/gloria.ogg
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/gloria.ogg)
          START=$(awk -v duration="$DURATION" 'BEGIN {print (duration > 12 ? (duration - 12) / 2 : 0)}')
          ffmpeg -nostdin -v error -ss "$START" -i /tmp/gloria.ogg -t 12 -ar 16000 -ac 1 -f s16le /tmp/gloria.pcm
      - name: Send genuine native fingerprint to Shazam and assert track
        run: node scripts/verify-shazam.cjs /tmp/gloria.pcm
      - name: Download additional public-domain recordings (not committed)
        continue-on-error: true
        run: |
          mkdir -p /tmp/freetune-samples
          curl -L --fail --retry 2 --user-agent 'FreeTune-CI/1.0 (public domain validation)' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ludwig_van_Beethoven_-_symphony_no._5_in_c_minor%2C_op._67_-_i._allegro_con_brio.ogg' -o /tmp/freetune-samples/first.ogg
          curl -L --fail --retry 2 --user-agent 'FreeTune-CI/1.0 (public domain validation)' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ludwig_van_Beethoven_-_symphony_no._5_in_c_minor%2C_op._67_-_iv._allegro.ogg' -o /tmp/freetune-samples/fourth.ogg
          ffmpeg -nostdin -v error -ss 55 -i /tmp/freetune-samples/first.ogg -t 12 -ar 16000 -ac 1 -f s16le /tmp/freetune-samples/first.pcm
          ffmpeg -nostdin -v error -ss 55 -i /tmp/freetune-samples/fourth.ogg -t 12 -ar 16000 -ac 1 -f s16le /tmp/freetune-samples/fourth.pcm
      - name: Probe additional public-domain recordings
        continue-on-error: true
        run: |
          # The known positive Gloria fixture already passed the required check.
          # Keep these exploratory probes optional without sending Gloria twice.
          if [ -s /tmp/freetune-samples/first.pcm ] && [ -s /tmp/freetune-samples/fourth.pcm ]; then
            node scripts/verify-shazam.cjs /tmp/freetune-samples/first.pcm /tmp/freetune-samples/fourth.pcm
          else
            echo 'ERROR: Cannot obtain real source recordings'
            exit 1
          fi
