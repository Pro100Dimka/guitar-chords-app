name: native-song-recognition
concurrency:
  group: native-song-recognition-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - react-native.config.*
      - patches/**
      - android/song-fingerprint/**
      - android/app/src/main/**
      - android/*.gradle
      - android/gradle/**
      - android/gradlew*
      - android/gradle.properties
      - android/app/*.gradle
      - android/app/proguard-rules.pro
      - __tests__/native/**
      - test-native.ps1
      - android/test-playback-capture.py
      - ios/**
      - test-ios-pitch.py
      - test-ios-capture.py
      - test-ios-recordings.py
      - test-ios-performance.py
      - test-ios-recognition.py
      - test-ios-offline-chords.py
      - scripts/check-offline-chord-native.py
      - scripts/fetch-offline-chord-fixtures.py
      - scripts/evaluate-offline-note-events.py
      - scripts/test-offline-note-events.py
      - scripts/inspect-audio-performance.cjs
      - docs/offline-chord-analysis-fixtures.json
      - src/components/audio-transcription.ts
      - src/components/audio-rhythm.ts
      - src/components/audio-tablature.ts
      - src/components/tablature.ts
      - .github/workflows/native-song-recognition.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  workflow_dispatch:
jobs:
  native:
    if: >-
      ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Main publishes caches; PRs reuse them without uploading each commit.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android NDK setup
        id: android-ndk
        run: |
          ndk_version=$(awk -F '"' '/^[[:space:]]*ndkVersion[[:space:]]*=/ { print $2 }' android/build.gradle)
          [[ "$ndk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$ndk_version" >> "$GITHUB_OUTPUT"
          # cargo-ndk and Gradle must use the same SDK, including on images that
          # preconfigure ANDROID_NDK_ROOT to a newer installed release.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          rustup show
          if [ ! -f "$ANDROID_HOME/ndk/$ndk_version/source.properties" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
      - name: Install pinned official cargo-ndk binary
        run: |
          archive="$RUNNER_TEMP/cargo-ndk-v4.1.2.tgz"
          curl --fail --location --retry 3 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' --output "$archive"
          echo "9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-ndk"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-ndk" --strip-components=1
          echo "$RUNNER_TEMP/cargo-ndk" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/cargo-ndk:$PATH" cargo ndk --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/song-fingerprint
          # rust-cache also fingerprints rustc, Cargo.lock and compiler flags.
          key: android-ndk-${{ steps.android-ndk.outputs.version }}-cargo-ndk-4.1.2-arm64-armv7-x86_64-release
          cache-bin: false
      - name: Native host fingerprint compilation
        # Exercise the same optimized inference kernels shipped in the app.
        # Debug-mode tensor execution makes the audio regression matrix impractical.
        run: |
          cargo test --locked --release --lib --manifest-path android/song-fingerprint/Cargo.toml
          # The probe includes the production modules directly. Compile it too,
          # without running the same acoustic regression matrix a second time.
          cargo build --locked --release --bin chord_probe --manifest-path android/song-fingerprint/Cargo.toml
      - name: Install JS dependencies
        run: npm ci
      - name: Real guitar note and tablature diagnostic
        id: note-quality
        timeout-minutes: 4
        run: |
          python3 scripts/test-offline-note-events.py
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          evidence="$RUNNER_TEMP/freetune-note-quality"
          mkdir -p "$evidence/input"
          python3 scripts/fetch-offline-chord-fixtures.py --output-dir "$evidence/input"
          ffmpeg -version > "$evidence/decoder-version.txt"
          ffmpeg -nostdin -y -v error -i "$evidence/input/00_SS3-98-C_comp_mic.wav" -ar 16000 -ac 1 -f s16le "$evidence/input/guitarset.pcm"
          probe="android/song-fingerprint/target/release/chord_probe"
          "$probe" "$evidence/input/guitarset.pcm" --note-trace "$evidence/note-trace.json" > "$evidence/native.json"
          node scripts/inspect-audio-performance.cjs "$evidence/native.json" "$evidence/performance.json"
          python3 scripts/evaluate-offline-note-events.py evaluate --reference "$evidence/input/00_SS3-98-C_comp.jams" --prediction "$evidence/native.json" --performance "$evidence/performance.json" --native-binary "$probe" --source-audio "$evidence/input/00_SS3-98-C_comp_mic.wav" --pcm "$evidence/input/guitarset.pcm" --output "$evidence/report.json"
      - name: Keep note quality evidence without media
        if: ${{ !cancelled() && steps.note-quality.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-note-quality
          path: |
            ${{ runner.temp }}/freetune-note-quality/native.json
            ${{ runner.temp }}/freetune-note-quality/performance.json
            ${{ runner.temp }}/freetune-note-quality/report.json
            ${{ runner.temp }}/freetune-note-quality/note-trace.json
            ${{ runner.temp }}/freetune-note-quality/decoder-version.txt
          retention-days: 30
          if-no-files-found: error
      - name: Chord evaluation semantics
        run: |
          python3 scripts/evaluate-offline-chords-extended.py self-test
          python3 scripts/test-offline-chord-section.py
      - name: Deterministic capture, recording stop and audio checks
        run: |
          KOTLIN_BIN=$(readlink -f "$(command -v kotlinc)")
          pwsh ./test-native.ps1 -KotlinLib "$(dirname "$KOTLIN_BIN")/../lib" -OutputDirectory "$RUNNER_TEMP/freetune-native-checks"
          python3 android/test-playback-capture.py --kotlin-lib "$(dirname "$KOTLIN_BIN")/../lib"
          python3 scripts/check-offline-chord-native.py --kotlin-lib "$(dirname "$KOTLIN_BIN")/../lib"
      - name: Compile Android Kotlin and all three Rust JNI architectures (no APK)
        working-directory: android
        run: |
          chmod +x gradlew
          # preBuild invokes buildSongFingerprintNative once, in the generated
          # directory actually consumed by sourceSets.main.jniLibs.
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon
          for abi in armeabi-v7a arm64-v8a x86_64; do
            library="app/build/generated/fingerprint/jniLibs/$abi/libfreetune_song_fingerprint.so"
            test -s "$library"
            file "$library"
            # Native library size is diagnostic, not the APK/store-download delta.
            wc -c "$library"
          done

  ios:
    if: >-
      ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/song-fingerprint
          key: ios-host-recognition-release
          cache-bin: false
      - name: Production iOS recognition and cancellation
        run: python3 test-ios-recognition.py
      - name: Production iOS offline chord analysis with real WAV and AAC decoding
        run: python3 test-ios-offline-chords.py
      - name: Production Swift pitch methods
        run: python3 test-ios-pitch.py
      - name: Production Swift capture route guards (fixtures)
        if: ${{ !cancelled() }}
        run: python3 test-ios-capture.py
      - name: Production Swift recording file methods with real AAC
        if: ${{ !cancelled() }}
        run: python3 test-ios-recordings.py
      - name: Production Swift instrument playback and lifecycle guards
        if: ${{ !cancelled() }}
        run: python3 test-ios-performance.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: system-signature-proof
          path: ${{ runner.temp }}/freetune-system-signature-proof
          retention-days: 1
