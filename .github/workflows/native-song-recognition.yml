name: native-song-recognition
concurrency:
  group: native-song-recognition-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feature/song-autofill]
    paths:
      - package.json
      - package-lock.json
      - react-native.config.*
      - patches/**
      - android/song-fingerprint/**
      - android/app/src/main/**
      - android/*.gradle
      - android/gradle/**
      - android/gradlew*
      - android/gradle.properties
      - android/app/*.gradle
      - android/app/proguard-rules.pro
      - __tests__/native/**
      - test-native.ps1
      - android/test-playback-capture.py
      - ios/**
      - test-ios-pitch.py
      - test-ios-capture.py
      - test-ios-recordings.py
      - test-ios-performance.py
      - test-ios-recognition.py
      - .github/workflows/native-song-recognition.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Main publishes caches; PRs reuse them without uploading each commit.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android NDK setup
        id: android-ndk
        run: |
          ndk_version=$(awk -F '"' '/^[[:space:]]*ndkVersion[[:space:]]*=/ { print $2 }' android/build.gradle)
          [[ "$ndk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$ndk_version" >> "$GITHUB_OUTPUT"
          # cargo-ndk and Gradle must use the same SDK, including on images that
          # preconfigure ANDROID_NDK_ROOT to a newer installed release.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          rustup show
          if [ ! -f "$ANDROID_HOME/ndk/$ndk_version/source.properties" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk_version"
          fi
      - name: Install pinned official cargo-ndk binary
        run: |
          archive="$RUNNER_TEMP/cargo-ndk-v4.1.2.tgz"
          curl --fail --location --retry 3 'https://github.com/bbqsrc/cargo-ndk/releases/download/v4.1.2/cargo-ndk-x86_64-unknown-linux-gnu-v4.1.2.tgz' --output "$archive"
          echo "9451622c4567e8abb2c8005001855e32901c0b716ccdd3a173a4375fd03426e1  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-ndk"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-ndk" --strip-components=1
          echo "$RUNNER_TEMP/cargo-ndk" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/cargo-ndk:$PATH" cargo ndk --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/song-fingerprint
          # rust-cache also fingerprints rustc, Cargo.lock and compiler flags.
          key: android-ndk-${{ steps.android-ndk.outputs.version }}-cargo-ndk-4.1.2-arm64-armv7-x86_64-release
          cache-bin: false
      - name: Native host fingerprint compilation
        run: cargo test --locked --manifest-path android/song-fingerprint/Cargo.toml
      - name: Deterministic capture, recording stop and audio checks
        run: |
          KOTLIN_BIN=$(readlink -f "$(command -v kotlinc)")
          pwsh ./test-native.ps1 -KotlinLib "$(dirname "$KOTLIN_BIN")/../lib" -OutputDirectory "$RUNNER_TEMP/freetune-native-checks"
          python3 android/test-playback-capture.py --kotlin-lib "$(dirname "$KOTLIN_BIN")/../lib"
      - name: Install JS dependencies
        run: npm ci
      - name: Compile Android Kotlin and all three Rust JNI architectures (no APK)
        working-directory: android
        run: |
          chmod +x gradlew
          # preBuild invokes buildSongFingerprintNative once, in the generated
          # directory actually consumed by sourceSets.main.jniLibs.
          ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon
          for abi in armeabi-v7a arm64-v8a x86_64; do
            library="app/build/generated/fingerprint/jniLibs/$abi/libfreetune_song_fingerprint.so"
            test -s "$library"
            file "$library"
          done

  ios:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/song-fingerprint
          key: ios-host-recognition-release
          cache-bin: false
      - name: Production iOS recognition and cancellation
        run: python3 test-ios-recognition.py
      - name: Production Swift pitch methods
        run: python3 test-ios-pitch.py
      - name: Production Swift capture route guards (fixtures)
        if: ${{ !cancelled() }}
        run: python3 test-ios-capture.py
      - name: Production Swift recording file methods with real AAC
        if: ${{ !cancelled() }}
        run: python3 test-ios-recordings.py
      - name: Production Swift instrument playback and lifecycle guards
        if: ${{ !cancelled() }}
        run: python3 test-ios-performance.py
