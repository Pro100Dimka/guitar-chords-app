name: native-song-recognition
on:
  push:
    branches: [feature/song-autofill]
    paths:
      - android/song-fingerprint/**
      - android/app/src/main/java/com/freetune/SongRecognitionModule.kt
      - android/app/src/main/java/com/freetune/SongFingerprint.kt
      - android/app/build.gradle
      - .github/workflows/native-song-recognition.yml
      - scripts/verify-shazam.cjs
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Android NDK setup
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          rustup show
          cargo install cargo-ndk --locked
      - name: Native host fingerprint compilation
        run: cargo test --manifest-path android/song-fingerprint/Cargo.toml
      - name: Install audio decoder for CI-only test clips
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download public-domain recordings (not committed)
        continue-on-error: true
        run: |
          mkdir -p /tmp/freetune-samples
          curl -L --fail --retry 2 --user-agent 'FreeTune-CI/1.0 (public domain validation)' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ludwig_van_Beethoven_-_symphony_no._5_in_c_minor%2C_op._67_-_i._allegro_con_brio.ogg' -o /tmp/freetune-samples/first.ogg
          curl -L --fail --retry 2 --user-agent 'FreeTune-CI/1.0 (public domain validation)' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Ludwig_van_Beethoven_-_symphony_no._5_in_c_minor%2C_op._67_-_iv._allegro.ogg' -o /tmp/freetune-samples/fourth.ogg
          ffmpeg -nostdin -v error -ss 55 -i /tmp/freetune-samples/first.ogg -t 12 -ar 16000 -ac 1 -f s16le /tmp/freetune-samples/first.pcm
          ffmpeg -nostdin -v error -ss 55 -i /tmp/freetune-samples/fourth.ogg -t 12 -ar 16000 -ac 1 -f s16le /tmp/freetune-samples/fourth.pcm
      - name: Genuine fingerprint and Shazam POST
        continue-on-error: true
        run: |
          if [ -s /tmp/freetune-samples/first.pcm ] && [ -s /tmp/freetune-samples/fourth.pcm ]; then
            node scripts/verify-shazam.cjs /tmp/freetune-samples/first.pcm /tmp/freetune-samples/fourth.pcm
          else
            echo 'ERROR: Cannot obtain real source recordings'
            exit 1
          fi
      - name: Install JS dependencies
        run: npm ci
      - name: Compile native Rust JNI for Android (no APK)
        working-directory: android/song-fingerprint
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release --lib
      - name: Compile Android Kotlin (no APK)
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:compileDebugKotlin --stacktrace --no-daemon
