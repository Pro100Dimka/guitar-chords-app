name: format-song-autofill
on:
  push:
    branches: [feature/song-autofill]
    paths:
      - .github/workflows/format-song-autofill.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git fetch origin feature/song-autofill && git checkout -B feature/song-autofill origin/feature/song-autofill
      - run: npm ci
      - run: npx prettier --write src/components/song-autofill/*.ts src/screens/create-song-chords/index.tsx src/screens/library/index.tsx src/router/index.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/song-autofill/*.ts src/screens/create-song-chords/index.tsx src/screens/library/index.tsx src/router/index.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format song autofill sources"
            git push origin HEAD:feature/song-autofill
          fi
